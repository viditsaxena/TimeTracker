name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test and package universal Mac app
        run: bash package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TimeTracker-macOS-universal
          path: build/release/*
